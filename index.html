<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Three-Body Problem · Orbital Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="sim"></canvas>

  <header class="title">
    <h1>The Three-Body Problem</h1>
    <p>A chaotic dance of gravity. Nudge the parameters and watch the cosmos unravel.</p>
  </header>

  <section id="panel" class="panel">
    <button id="collapse" class="collapse" title="Hide / show panel" aria-label="Toggle panel">⟨⟩</button>

    <div class="panel-inner">
      <div class="group">
        <label class="group-title">Presets</label>
        <div class="presets" id="presets"></div>
      </div>

      <div class="group">
        <label class="group-title">Simulation</label>

        <div class="slider">
          <span>Gravity <em id="gVal"></em></span>
          <input type="range" id="gravity" min="0.05" max="6" step="0.05" />
        </div>
        <div class="slider">
          <span>Speed <em id="speedVal"></em></span>
          <input type="range" id="speed" min="0.1" max="4" step="0.1" />
        </div>
        <div class="slider">
          <span>Trail length <em id="trailVal"></em></span>
          <input type="range" id="trail" min="0" max="1400" step="20" />
        </div>
      </div>

      <div class="group" id="bodyControls">
        <label class="group-title">Bodies</label>
      </div>

      <div class="actions">
        <button id="playPause" class="btn primary">Pause</button>
        <button id="reset" class="btn">Reset</button>
      </div>
      <p class="hint">Tip: drag a glowing body to fling it into a new orbit.</p>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
